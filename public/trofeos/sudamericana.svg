  </defs>

  <!-- la esfera grande con su faja dorada -->
  <circle cx="60" cy="62" r="52" fill="url(#s_bola)"/>
  <rect x="2" y="55" width="116" height="14" fill="url(#s_aro)"/>
  <rect x="0" y="60" width="120" height="3" fill="#8f9498" opacity=".55"/>

