<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 320" width="120" height="320">
  <defs>
    <radialGradient id="s_bola" cx=".38" cy=".28" r=".8">
      <stop offset="0" stop-color="#dcdfe1"/><stop offset=".5" stop-color="#c2c6c9"/>
      <stop offset="1" stop-color="#9ba0a4"/>
    </radialGradient>
    <linearGradient id="s_aro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c96a"/><stop offset=".5" stop-color="#e0a63a"/>
