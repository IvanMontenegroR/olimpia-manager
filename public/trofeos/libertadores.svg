<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 320" width="120" height="320">
  <defs>
    <linearGradient id="plata" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a4"/><stop offset=".38" stop-color="#e6e9ea"/>
      <stop offset=".62" stop-color="#c8ccd0"/><stop offset="1" stop-color="#8f9599"/>
    </linearGradient>
    <radialGradient id="bola" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#f2f4f5"/><stop offset=".55" stop-color="#c9ced2"/>
      <stop offset="1" stop-color="#8d9297"/>
    </radialGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e1c10"/><stop offset=".45" stop-color="#5a3a22"/>
      <stop offset="1" stop-color="#25150c"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a22"/><stop offset=".45" stop-color="#e3c46a"/>
      <stop offset="1" stop-color="#7d5f1d"/>
    </linearGradient>
  </defs>

  <!-- el jugador de arriba -->
  <g fill="url(#plata)">
    <circle cx="60" cy="14" r="5"/>
    <path d="M60 19c-7 2-11 7-12 13l4 2 4-7 1 12h6l1-12 4 7 4-2c-1-6-5-11-12-13z"/>
    <path d="M55 45l-3 16h4l3-12 3 12h4l-3-16z"/>
  </g>
  <rect x="56" y="60" width="8" height="8" fill="url(#plata)"/>

  <!-- la esfera y las asas -->
  <circle cx="60" cy="110" r="42" fill="url(#bola)"/>
  <rect x="6" y="102" width="16" height="16" rx="2" fill="url(#plata)"/>
  <rect x="98" y="102" width="16" height="16" rx="2" fill="url(#plata)"/>
  <rect x="20" y="107" width="8" height="6" fill="url(#plata)"/>
  <rect x="92" y="107" width="8" height="6" fill="url(#plata)"/>

  <!-- el cuello y la campana -->
  <rect x="50" y="150" width="20" height="42" fill="url(#plata)"/>
  <path d="M50 192L28 244h64L70 192z" fill="url(#plata)"/>
  <path d="M24 244h72c6 0 10 5 10 11H14c0-6 4-11 10-11z" fill="url(#plata)"/>

  <!-- la base de madera con sus placas -->
  <rect x="10" y="255" width="100" height="58" rx="4" fill="url(#madera)"/>
  <rect x="18" y="262" width="24" height="14" rx="2" fill="url(#oro)"/>
  <rect x="48" y="262" width="24" height="14" rx="2" fill="url(#oro)"/>
  <rect x="78" y="262" width="24" height="14" rx="2" fill="url(#oro)"/>
  <rect x="18" y="281" width="24" height="14" rx="2" fill="url(#oro)"/>
  <rect x="48" y="281" width="24" height="14" rx="2" fill="url(#oro)"/>
  <rect x="78" y="281" width="24" height="14" rx="2" fill="url(#oro)"/>
  <rect x="6" y="300" width="108" height="14" rx="3" fill="url(#madera)"/>
</svg>
