<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 320" width="120" height="320">
  <defs>
    <linearGradient id="i_oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c09a30"/><stop offset=".3" stop-color="#f0d377"/>
      <stop offset=".62" stop-color="#d8b44c"/><stop offset="1" stop-color="#a8862a"/>
    </linearGradient>
    <radialGradient id="i_bola" cx=".34" cy=".26" r=".82">
      <stop offset="0" stop-color="#f6f7f8"/><stop offset=".5" stop-color="#d4d8db"/>
      <stop offset="1" stop-color="#a3a8ac"/>
    </radialGradient>
    <linearGradient id="i_base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b08d2c"/><stop offset=".4" stop-color="#edcf70"/>
      <stop offset="1" stop-color="#b4912e"/>
    </linearGradient>
  </defs>

  <!-- la esfera, arriba y corrida a la izquierda como en el original -->
  <circle cx="50" cy="40" r="33" fill="url(#i_bola)" stroke="#7b7f83" stroke-width="1.2"/>

  <!--
    Las varillas. Son finas, arrancan juntas en la base y se abren arriba
    cruzándose sobre la esfera: eso es lo que le da la forma de ramo. Con
    varillas rectas parecía una reja y perdía todo el parecido.
  -->
  <g fill="url(#i_oro)" stroke="#4a3a12" stroke-width="1.5" stroke-linejoin="round">
    <path d="M32 250c-4-58 0-116-16-196l8-4c18 82 14 142 18 200z"/>
    <path d="M50 250c-2-62 2-124-6-208l9-2c9 84 5 148 7 210z"/>
    <path d="M66 250c2-62 6-126 20-206l8 3c-15 80-17 143-19 203z"/>
    <path d="M82 250c4-56 12-112 30-186l7 5c-19 74-26 127-30 181z"/>
  </g>

  <!-- la base, un trapecio ancho -->
  <path d="M20 250h80l14 60H6z" fill="url(#i_base)" stroke="#4a3a12" stroke-width="1.6"/>
</svg>
